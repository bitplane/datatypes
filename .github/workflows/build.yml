name: AROS datatype checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decoder:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: make test

  sdk:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i386-aros
            toolbox: aros/2026-08-31/i386:v0.1.1
          - target: aarch64-aros
            toolbox: aros/2026-08-31/aarch64:v0.1.1
          - target: x86_64-aros
            toolbox: aros/2026-08-31/x86_64:v0.1.8
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - name: Build Targa datatype
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLBOX: ${{ matrix.toolbox }}
          TARGET: ${{ matrix.target }}
        run: |
          image="ghcr.io/bitplane/mountin/builder/compiler/$TOOLBOX"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
              --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$image"
          docker run --rm --volume "$PWD:/work" --workdir /work \
              "$image" sh scripts/build.sh "$TARGET" targa
      - uses: actions/upload-artifact@v4
        with:
          name: targa-${{ matrix.target }}
          path: dist/${{ matrix.target }}/targa.datatype
