name: AROS datatype checks

on:
  push:
    branches: [master]
    tags: ['*-*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decoder:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: sh scripts/tag-package.sh "$GITHUB_REF_NAME"
      - run: make test

  sdk:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i386-aros
            toolbox: aros/2026-08-31/i386:v0.1.1
          - target: aarch64-aros
            toolbox: aros/2026-08-31/aarch64:v0.1.1
          - target: x86_64-aros
            toolbox: aros/2026-08-31/x86_64:v0.1.8
          - target: m68k-aros
            toolbox: aros/2026-08-31/m68k:v0.1.9
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: sh scripts/tag-package.sh "$GITHUB_REF_NAME"
      - name: Build Targa datatype
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLBOX: ${{ matrix.toolbox }}
          TARGET: ${{ matrix.target }}
        run: |
          image="ghcr.io/bitplane/mountin/builder/compiler/$TOOLBOX"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
              --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$image"
          docker run --rm --volume "$PWD:/work" --workdir /work \
              "$image" sh scripts/build.sh "$TARGET" targa
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/')
        run: sh scripts/aros/package.sh '${{ matrix.target }}' targa "${GITHUB_REF_NAME#targa-}"
      - uses: actions/upload-artifact@v7
        with:
          name: targa-${{ matrix.target }}
          path: |
            dist/${{ matrix.target }}/targa.datatype
            dist/*.tar.bz2*
          if-no-files-found: error

  release:
    needs: [decoder, sdk]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.tar.bz2
            artifacts/**/*.sha256

  sync-pkg:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: ./.github/workflows/sync-aros.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      AROS_PKG_KEY: ${{ secrets.AROS_PKG_KEY }}
